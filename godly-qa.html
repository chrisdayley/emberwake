<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emberwake Godly sandbox</title><style>body{background:#13232b;color:#eee;font:16px system-ui;margin:16px}button,select{padding:10px;margin:4px;background:#28404a;color:#fff;border:1px solid #52717a}canvas{display:block;width:667px;height:375px;max-width:100%;border:1px solid #64777a}pre{white-space:pre-wrap}p{max-width:800px;line-height:1.5}</style></head><body><h2>Godly equipment sandbox · No save access</h2><select id="family" aria-label="Equipment family"></select><button id="show">Show Godly power</button><button id="advance">Advance one second</button><p id="perk"></p><canvas width="667" height="375"></canvas><pre id="report"></pre><script type="module">
import {Game} from './engine.js?v=27';import {freshSave} from './data.js?v=27';import {Renderer,artReady} from './render.js?v=27';import {FAMILIES,gearPerks} from './gear.js?v=27';
const $=s=>document.querySelector(s);$('#family').innerHTML=FAMILIES.map(f=>`<option value="${f.id}">${f.name}</option>`).join('');await artReady;let g;const r=new Renderer($('canvas'));const settings={shake:false,fx:1};
function report(){r.draw(g,settings,{x:0,y:0},g.time);$('#report').textContent=JSON.stringify({gear:g.gear.name,power:g.gearBonuses.godly,revives:g.revives,health:g.player.hp,shield:g.shield,damage:g.damageDone,powerState:g.divine,projectiles:g.bullets.length,hazards:g.hazards.length},null,2);}
function scene(){const id=$('#family').value,s=freshSave();s.inventory[id+':6']={level:5};s.equipment.ranger=id+':6';g=new Game(s);g.skills={};g.random=()=>.99;g.invuln=999;g.spawnClock=g.nextBoss=g.nextElite=g.nextCache=g.nextHeal=g.nextWorldStrike=g.nextObjective=g.nextDiscoveryScan=1e9;g.lateStarted=true;for(let j=0;j<10;j++){const e=g.spawn('brute',false,j===9);const a=j*Math.PI/5;e.x=150*Math.cos(a);e.y=110*Math.sin(a);e.hp=e.maxHp=1e7;e.speed=0;e.attack=999;}const e=g.enemies[0];for(let n=0;n<12;n++)g.hit(e,1,'bolt');if(id==='axe')for(let n=0;n<12;n++){const v=g.spawn();v.hp=1;g.hit(v,5,'bolt');}if(id==='scythe'){e.hp=e.maxHp*.2;g.hit(e,1,'bolt');}if(['nova','orbit'].includes(id))g.hurt(20);g.dash({x:1,y:0});for(let i=0;i<10;i++)g.step(.05);g.mode='paused';$('#perk').textContent=gearPerks(g.gear).at(-1).text;report();}
$('#show').onclick=scene;$('#advance').onclick=()=>{g.mode='playing';for(let i=0;i<20;i++)g.step(.05);g.mode='paused';report();};scene();
</script></body></html>
