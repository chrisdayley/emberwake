<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emberwake campaign QA</title><style>body{background:#13232b;color:#eee;font:14px system-ui;margin:12px}button,select{padding:8px;margin:4px;background:#28404a;color:#fff;border:1px solid #52717a}canvas{display:block;width:667px;height:375px;max-width:100%;border:1px solid #64777a}pre{white-space:pre-wrap}</style></head><body><h2>Campaign sandbox · No save access</h2><select id="stage" aria-label="Stage"></select><button id="scene">Show stage</button><button id="boss">Show Last Eclipse</button><button id="play">Play / pause sandbox</button><button id="unlock">Test stage rewards</button><button id="audio">Music on / off</button><canvas></canvas><pre id="report"></pre><script type="module">
import {Game} from './engine.js?v=20';import {Renderer,artReady} from './render.js?v=20';import {freshSave} from './data.js?v=20';import {SPECIAL_STAGES,EXTRA_WEAPONS,ensureChronicle,recordChronicle} from './chronicle.js?v=20';import {spawnReaper} from './challenge.js?v=20';import {AdaptiveMusic} from './music.js?v=20';
const $=s=>document.querySelector(s);$('#stage').innerHTML=SPECIAL_STAGES.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');await artReady;const r=new Renderer($('canvas'));let g,playing=false,music,enabled=false;const settings={shake:false,fx:.65,music:true,musicVolume:.3};
function scene(boss=false){const s=ensureChronicle(freshSave());s.region=$('#stage').value;s.hero=SPECIAL_STAGES.find(x=>x.id===s.region).hero;s.heroes.push(s.hero);s.unlockedWeapons=EXTRA_WEAPONS.map(w=>w.id);g=new Game(s);g.time=315.5;g.skills={aegis:8,chrono:8,guard:3,haste:3};g.evolved=['aegis','chrono'];g.nextDiscoveryScan=1e9;g.nextBoss=g.nextElite=g.nextWorldStrike=1e9;g.spawnClock=1e9;for(let j=0;j<6;j++){const e=g.spawn(s.region+'_'+j,false,j>3);e.x=(j%3-1)*220;e.y=(Math.floor(j/3)*2-1)*120;e.attack=0;}if(boss){g.enemies=[];g.time=1800;spawnReaper(g);const e=g.enemies[0];e.x=180;e.y=-50;e.attack=0;}g.step(.01);g.mode='paused';playing=false;report();}
function report(){ $('#report').textContent=JSON.stringify({region:g.region,hero:g.hero.name,mode:g.mode,time:g.time,health:g.player.hp,enemies:g.enemies.map(e=>({type:e.type,hp:e.hp,title:e.title})),hazards:g.hazards.length,music:music?.status()},null,2);}
$('#scene').onclick=()=>scene();$('#boss').onclick=()=>scene(true);$('#play').onclick=()=>{playing=!playing;g.mode=playing?'playing':'paused';report();};$('#unlock').onclick=()=>{const s=ensureChronicle(freshSave());g.time=600;g.discoveriesCleared=1;const rewards=recordChronicle(s,g);$('#report').textContent=JSON.stringify({rewards:rewards.map(a=>a.label),heroes:s.heroes,weapons:s.unlockedWeapons,stages:s.unlockedRegions},null,2);};$('#audio').onclick=async()=>{music??=new AdaptiveMusic(new AudioContext());await music.context.resume();enabled=!enabled;};let last=0;const keys={};onkeydown=e=>keys[e.key]=true;onkeyup=e=>keys[e.key]=false;function tick(now){const dt=Math.min(.05,(now-last)/1000);last=now;const input={x:(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),y:(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0)};if(playing)g.step(dt,input);r.draw(g,settings,input,now/1000);music?.update(g.region,g.time,enabled,settings,document.hidden);requestAnimationFrame(tick);}scene();requestAnimationFrame(tick);
document.modelContext?.registerTool({name:'read_campaign_sandbox',description:'Read this disposable sandbox, which never accesses the real save.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>({region:g.region,health:g.player.hp,time:g.time,enemies:g.enemies.length,canvas:{width:r.w,height:r.h},music:music?.status()})});
</script></body></html>
