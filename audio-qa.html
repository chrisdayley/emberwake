<!doctype html><meta charset="utf-8"><title>Emberwake soundtrack QA</title><style>body{background:#12232b;color:#faf2de;font:18px system-ui;padding:24px}button,select,audio{margin:8px;padding:10px}pre{white-space:pre-wrap}</style><h1>Soundtrack render check</h1><select id="region"><option>ashwood</option><option>hollow</option><option>cinder</option></select><select id="phase"><option value="0">Opening</option><option value="300">5 minutes</option><option value="600">10 minutes</option><option value="900">15 minutes</option><option value="1500">25 minutes</option></select><select id="section"><option value="0">Section 1</option><option value="1">Section 2</option><option value="2">Section 3</option><option value="3">Section 4</option><option value="4">Section 5</option><option value="5">Section 6</option><option value="6">Section 7</option><option value="7">Section 8</option></select><button id="render">Render and play 12 seconds</button><audio id="player" controls></audio><button id="start">Start live soundtrack</button><button id="stop">Pause soundtrack</button><canvas width="650" height="220"></canvas><pre id="status"></pre><pre id="result"></pre>
<script type="module">
import {AdaptiveMusic,scoreState,scoreNotes} from './music.js?v=22';
import {drawDanger} from './danger.js?v=22';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');ctx.fillStyle='#17212f';ctx.fillRect(0,0,650,220);ctx.strokeStyle='#dca3ed';ctx.fillStyle='#dca3ed33';ctx.lineWidth=2;ctx.beginPath();ctx.arc(150,110,70,0,Math.PI*2);ctx.fill();ctx.stroke();drawDanger(ctx,[{kind:'eruption',x:440,y:110,r:70,life:1,max:2,color:'#cdadff'},{kind:'shot',x:565,y:110,r:7,color:'#bea1ff'}],1);ctx.fillStyle='white';ctx.font='16px system-ui';ctx.fillText('Player meteor',90,205);ctx.fillText('Hostile AOE + projectile',365,205);
let liveMusic,playing=false;
document.querySelector('#start').onclick=async()=>{if(!liveMusic)liveMusic=new AdaptiveMusic(new AudioContext());await liveMusic.context.resume();playing=true;};
document.querySelector('#stop').onclick=()=>{playing=false;liveMusic?.stop();};
function tick(){if(liveMusic){liveMusic.update(document.querySelector('#region').value,+document.querySelector('#phase').value,playing,{music:true,musicVolume:.4},document.hidden);document.querySelector('#status').textContent=JSON.stringify(liveMusic.status(),null,2);}requestAnimationFrame(tick);}requestAnimationFrame(tick);

async function sample(region,seconds,play=false,section=0){const c=new OfflineAudioContext(2,44100*12,44100),m=new AdaptiveMusic(c);m.region=region;m.master.gain.value=.55;let t=0,step=section*256;while(t<10){for(const n of scoreNotes(region,seconds,step++))m.note(n,t+(n.delay||0));t+=60/scoreState(region,seconds).bpm/4; // Offline sources do not fire onended until rendering. The real-time cap is unrelated to offline generation.
 m.voices.clear();}
 const b=await c.startRendering();let sum=0,peak=0;for(let channel=0;channel<b.numberOfChannels;channel++)for(const x of b.getChannelData(channel)){sum+=x*x;peak=Math.max(peak,Math.abs(x));}const report={region,seconds,section,notes:m.scheduled,peak,rms:Math.sqrt(sum/(b.length*b.numberOfChannels))};
 if(play){const wav=new ArrayBuffer(44+b.length*2),v=new DataView(wav);function str(p,s){[...s].forEach((x,i)=>v.setUint8(p+i,x.charCodeAt(0)));}str(0,'RIFF');v.setUint32(4,36+b.length*2,true);str(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,44100,true);v.setUint32(28,88200,true);v.setUint16(32,2,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,b.length*2,true);b.getChannelData(0).forEach((x,i)=>v.setInt16(44+i*2,Math.max(-1,Math.min(1,x))*32767,true));const player=document.querySelector('audio');if(player.src)URL.revokeObjectURL(player.src);player.src=URL.createObjectURL(new Blob([wav],{type:'audio/wav'}));player.play().catch(()=>{});}
 return report;}
document.querySelector('#render').onclick=async()=>document.querySelector('#result').textContent=JSON.stringify(await sample(document.querySelector('#region').value,+document.querySelector('#phase').value,true,+document.querySelector('#section').value),null,2);
document.modelContext?.registerTool({name:'test_soundtrack_render',description:'Render eight sections of all three game themes at opening and full intensity at maximum music volume using offline Web Audio. Returns signal levels without playing sound or changing any save.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:async()=>{const out=[];for(const region of ['ashwood','hollow','cinder'])for(const seconds of [0,1500])for(let section=0;section<8;section++)out.push(await sample(region,seconds,false,section));document.querySelector('pre').textContent=JSON.stringify(out,null,2);return out;}});
</script>
