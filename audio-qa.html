<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emberwake · Orchestral audio verification</title><style>body{margin:24px;background:#142024;color:#f3e6c7;font:16px/1.5 system-ui}button,select{font:inherit;padding:12px;margin:5px;background:#2c4144;color:#f3e6c7;border:1px solid #81969a;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}h1{font:32px Georgia}a{color:#f3d28c}</style><h1>Orchestral audio · v27</h1><p>Isolated audio verification. This page never changes your game save.</p><label>Suite <select id="region"></select></label><div><button id="start">Play opening</button><button data-seek="600">10 minutes</button><button data-seek="1200">20 minutes</button><button data-seek="1740">29 minutes</button><button data-seek="1800">30-minute encounter</button><button data-seek="2090">Final 10 seconds</button></div><div><button id="reward">Open upgrade menu</button><button id="chest">Open chest menu</button><button id="pause">Pause</button><button id="resume">Resume</button><button id="mute">Mute music</button><button id="restore">Save & restore audio position</button></div><div><button data-sound="cast:frost">Frost cast</button><button data-sound="cast:flame">Flame cast</button><button data-sound="impact:dagger">Blade impact</button><button data-sound="hurt">Player damage</button><button data-sound="treasure">Treasure</button><button data-sound="warning">Boss warning</button><button id="effects">Toggle effects</button></div><div id="recording"></div><details><summary>Rendered suite files</summary><div id="downloads"></div></details><p id="mode">Ready</p><pre id="status">Press Play to enable audio.</pre><p id="save">Checking save fingerprint…</p><p><a href="./audio-credits.html">Music and sound credits</a></p><script type="module">
import {AdaptiveMusic,THEMES} from './music.js?v=27';import {CombatFoley} from './foley.js?v=27';
const $=s=>document.querySelector(s),key='emberwake-save-v1',before=localStorage.getItem(key);let ctx,music,foley,analyser,mode='paused',gameSeconds=0,settings={music:true,musicVolume:.4,sound:true},last=performance.now(),rms=0,peak=0,restored=null;
for(const id of Object.keys(THEMES)){const o=document.createElement('option');o.value=id;o.textContent=id;$('#region').append(o);const a=document.createElement('a');a.href=THEMES[id].file;a.download=id+'-suite-v27.m4a';a.textContent='Download '+id+' suite';a.style.display='block';$('#downloads').append(a);}
async function fingerprint(){const text=localStorage.getItem(key);const hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text??''));$('#save').textContent=`Save unchanged: ${text===before} · Present: ${text!==null} · SHA256: ${[...new Uint8Array(hash)].map(v=>v.toString(16).padStart(2,'0')).join('')}`;}
function unlock(){ctx??=new AudioContext();ctx.resume();if(!music){music=new AdaptiveMusic(ctx);music.media.controls=true;music.media.setAttribute('aria-label','Current orchestral recording');$('#recording').append(music.media);analyser=ctx.createAnalyser();analyser.fftSize=1024;music.bus.connect(analyser);foley=new CombatFoley(ctx);foley.load();}music.unlock();}
function seek(seconds){unlock();gameSeconds=seconds;music.begin($('#region').value,{version:27,region:$('#region').value,seconds},seconds,'qa');mode='playing';music.update($('#region').value,gameSeconds,true,settings);peak=0;}
$('#start').onclick=()=>seek(0);for(const b of document.querySelectorAll('[data-seek]'))b.onclick=()=>seek(Number(b.dataset.seek));
$('#reward').onclick=()=>{unlock();mode=mode==='levelup'?'playing':'levelup';};$('#chest').onclick=()=>{unlock();mode=mode==='chest'?'playing':'chest';};$('#pause').onclick=()=>{mode='paused';music?.stop();foley?.stop();};$('#resume').onclick=()=>{unlock();mode='playing';music.update($('#region').value,gameSeconds,true,settings);};$('#mute').onclick=()=>{settings.music=!settings.music;$('#mute').textContent=settings.music?'Mute music':'Unmute music';};
$('#restore').onclick=()=>{unlock();const saved=music.checkpoint();music.begin(saved.region,saved,gameSeconds,'qa');restored=saved.seconds;music.update(saved.region,gameSeconds,true,settings);mode='playing';};
for(const b of document.querySelectorAll('[data-sound]'))b.onclick=()=>{unlock();const [kind,weapon]=b.dataset.sound.split(':');foley.event(kind,{weapon});};$('#effects').onclick=()=>{unlock();settings.sound=!settings.sound;foley.setEnabled(settings.sound);};
setInterval(()=>{const n=performance.now(),dt=Math.min(1,(n-last)/1000);last=n;if(mode==='playing'&&!document.hidden)gameSeconds+=dt;if(music){music.update($('#region').value,gameSeconds,['playing','levelup','chest'].includes(mode),settings,document.hidden);const samples=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(samples);rms=Math.sqrt(samples.reduce((a,v)=>a+v*v,0)/samples.length);peak=Math.max(peak,rms);$('#status').textContent=JSON.stringify({gameSeconds:Number(gameSeconds.toFixed(2)),music:music.status(),effects:foley.status(),rms,peakRms:peak,restored},null,2);}$('#mode').textContent='Mode: '+mode;fingerprint();},250);fingerprint();
</script></html>
